name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Package release
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/DockerSweep-${GITHUB_REF_NAME#v}-arm64.zip" \
            "dist/DockerSweep-${GITHUB_REF_NAME#v}-arm64.zip.sha256" \
            --title "DockerSweep ${GITHUB_REF_NAME#v}" \
            --generate-notes
