name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package and upload"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Package release
        run: ./scripts/package-release.sh "${RELEASE_TAG#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "DockerSweep ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/DockerSweep-${RELEASE_TAG#v}-arm64.zip" \
            "dist/DockerSweep-${RELEASE_TAG#v}-arm64.zip.sha256" \
            --clobber
